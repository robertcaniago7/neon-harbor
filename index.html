<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Harbor — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Touch controls: hidden on desktop, shown on touch screens. */
  #touch-pad { display: none; }
  html.touch #touch-pad { display: block; }
  @media (pointer: coarse) { #touch-pad { display: block; } }
  #touch-pad button {
    font-family: system-ui, sans-serif; font-weight: 700; color: #fff;
    background: rgba(20, 16, 40, 0.55); border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #touch-pad button:active { background: rgba(255, 210, 63, 0.55); }
  .dpad {
    position: fixed; left: 14px; bottom: 18px; z-index: 10;
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px;
  }
  .dpad button { font-size: 22px; }
  #btn-up { grid-column: 2; grid-row: 1; }
  #btn-left { grid-column: 1; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #btn-down { grid-column: 2; grid-row: 3; }
  .actions {
    position: fixed; right: 14px; bottom: 18px; z-index: 10;
    display: grid; grid-template-columns: repeat(2, 68px); grid-auto-rows: 58px; gap: 8px;
  }
  .actions button { font-size: 12px; letter-spacing: 0.5px; }
  .mini {
    position: fixed; right: 14px; top: 185px; z-index: 10;
    display: flex; gap: 8px;
  }
  .mini button { font-size: 11px; padding: 10px 12px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Harbor: explore the city on foot and by car, steal cars, dodge the police and run missions for Madame Kestrel"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="touch-pad" aria-hidden="true">
  <div class="dpad">
    <button id="btn-up" type="button">▲</button>
    <button id="btn-left" type="button">◀</button>
    <button id="btn-right" type="button">▶</button>
    <button id="btn-down" type="button">▼</button>
  </div>
  <div class="actions">
    <button id="btn-car" type="button">MOBIL</button>
    <button id="btn-punch" type="button">PUKUL</button>
    <button id="btn-mission" type="button">MISI</button>
    <button id="btn-pause" type="button">JEDA</button>
  </div>
  <div class="mini">
    <button id="btn-continue" type="button">LANJUT</button>
    <button id="btn-mute" type="button">SUARA</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
